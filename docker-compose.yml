# Optional local dependencies. Set POSTGRES_PASSWORD before starting.
# Does not start the application or execute migrations.
services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-erp_foundation}
      POSTGRES_USER: ${POSTGRES_USER:-erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - erp_foundation_pgdata:/var/lib/postgresql
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - erp_foundation_redis:/data
volumes:
  erp_foundation_pgdata:
  erp_foundation_redis:
