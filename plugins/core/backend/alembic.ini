[public]
script_location = alembic
version_locations = %(here)s/alembic/versions/public
prepend_sys_path = .
path_separator = os
sqlalchemy.url =

[tenant]
script_location = alembic
version_locations = %(here)s/alembic/versions/core
    %(here)s/alembic/versions/plugins
    %(here)s/.local-migrations/legacy
recursive_version_locations = true
prepend_sys_path = .
path_separator = newline
sqlalchemy.url =

[tenant_core]
script_location = alembic
version_locations = %(here)s/alembic/versions/core
    %(here)s/alembic/versions/plugins
    %(here)s/.local-migrations/legacy
recursive_version_locations = true
prepend_sys_path = .
path_separator = newline
sqlalchemy.url =

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
