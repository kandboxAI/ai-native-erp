[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "erp-resource-discovery"
version = "0.1.0"
description = "Authorization-first ERP metadata discovery with portable adapters and pgvector"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2,<3", "httpx>=0.28,<1", "SQLAlchemy>=2,<3", "rank-bm25>=0.2.2,<0.3", "pgvector>=0.3,<0.5"]

[tool.setuptools]
packages = ["resource_discovery"]
package-dir = {resource_discovery = "."}
